---
# tasks/service.yml
- name: Copy TokenLedger systemd service template
  template:
    src: token_ledger.service.j2
    dest: /etc/systemd/system/token_ledger.service
    owner: root
    group: root
    mode: ''0644''

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start TokenLedger service
  systemd:
    name: token_ledger
    state: started
    enabled: yes