---
# tasks/postgresql.yml
- name: Install PostgreSQL official apt repository key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL official apt repository
  apt_repository:
    repo: deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main
    state: present
    filename: pgdg

- name: Update apt cache (for PostgreSQL repo)
  apt:
    update_cache: yes

- name: Install PostgreSQL 16 and contrib package
  apt:
    name:
      - postgresql-16
      - postgresql-contrib-16
    state: present

- name: Ensure PostgreSQL service is started and enabled
  systemd:
    name: postgresql
    state: started
    enabled: yes