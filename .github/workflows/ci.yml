name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_ledger_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      MIX_ENV: test
      ANVIL_PID: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.x"
          otp-version: "27.x"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            token_ledger/deps
            token_ledger/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('token_ledger/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create Postgres secrets file
        run: |
          mkdir -p secrets
          echo "postgres" > secrets/postgres_password.txt

      - name: Start Anvil
        run: |
          anvil --port 8545 &
          for i in $(seq 1 30); do
            if nc -z localhost 8545 2>/dev/null; then
              echo "Anvil is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: cd token_ledger && mix deps.get

      - name: Setup database
        run: cd token_ledger && mix ecto.setup

      - name: Run ExUnit tests
        run: cd token_ledger && mix test

      - name: Run Foundry tests
        run: forge test

      - name: Stop Anvil
        if: always()
        run: pkill anvil || true
