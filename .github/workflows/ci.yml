name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_ledger_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.x'
          otp-version: '26.x'

      - name: Cache Hex packages
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up PostgreSQL secrets file
        run: |
          mkdir -p secrets
          echo "postgres" > secrets/postgres_password.txt

      - name: Start Anvil
        run: |
          anvil --port 8545 &
          export ANVIL_PID=$!
          echo "Anvil started with PID $ANVIL_PID"
          # Wait for Anvil to be ready
          for i in {1..30}; do
            if nc -z localhost 8545; then
              echo "Anvil is ready"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: mix deps.get

      - name: Setup database
        run: mix ecto.setup

      - name: Run ExUnit tests
        run: mix test

      - name: Run Foundry tests
        run: forge test

      - name: Stop Anvil
        if: always()
        run: |
          kill $ANVIL_PID || true